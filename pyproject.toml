# uv workspace root (virtual: no [project]). Members are the deployable Python services.
[tool.uv.workspace]
members = ["app/api", "app/worker"]

[dependency-groups]
dev = ["pytest>=9.2", "httpx>=0.28.1", "ruff>=0.17.6"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".claude/worktrees"] # agent worktrees are full repo copies

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I imports, B bugbear, UP pyupgrade, S bandit (security), SIM simplify
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"] # asserts and fake keys are fine in tests

[tool.pytest.ini_options]
testpaths = ["app/api/tests", "app/worker/tests"]
markers = ["azurite: needs a running Azurite (set AZURITE_TESTS=1)"]
addopts = "--import-mode=importlib"

[tool.ruff.lint.isort]
known-first-party = ["gyazo_api", "gyazo_worker"]
