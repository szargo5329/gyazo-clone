# One service account per workload, each federated to its own user-assigned managed
# identity (D-005, D-021). Names must match the federated credential subjects in
# infra/terraform/modules/identity: system:serviceaccount:gyazo:api and :worker.
# The client IDs are not secrets (terraform output); they say which identity to use, and
# only a token issued for the matching service account can act as it.
#
# automountServiceAccountToken: false. Neither workload calls the Kubernetes API, so the
# default API token has no use. Workload identity doesn't need it either:
# - the azure-workload-identity webhook injects its own projected token volume
#   (audience api://AzureADTokenExchange) into pods labelled azure.workload.identity/use;
# - the Secrets Store CSI driver gets its token from the kubelet through the CSIDriver
#   tokenRequests field (audience api://AzureADTokenExchange on this cluster).
# Neither path reads the automounted token. The pod specs set the same field.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: gyazo
  labels:
    app.kubernetes.io/name: gyazo-api
    app.kubernetes.io/component: api
  annotations:
    azure.workload.identity/client-id: 683be59e-d1eb-4c22-829e-0ecc75ed21e3 # id-gyazo-api-dev
    azure.workload.identity/tenant-id: 79906a38-3bc4-4593-a1f4-acc599980625
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: gyazo
  labels:
    app.kubernetes.io/name: gyazo-worker
    app.kubernetes.io/component: worker
  annotations:
    azure.workload.identity/client-id: 4b21c36d-d17d-4c32-8f32-e55366fa9c87 # id-gyazo-worker-dev
    azure.workload.identity/tenant-id: 79906a38-3bc4-4593-a1f4-acc599980625
automountServiceAccountToken: false
