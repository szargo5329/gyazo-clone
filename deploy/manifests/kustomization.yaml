# First M3 slice: kubectl apply -k deploy/manifests
# Plain list of files, no overlays (Helm replaces this in M5). Order here is cosmetic;
# kubectl/kustomize apply Namespace and ServiceAccounts before workloads anyway.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: gyazo-clone
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false # selectors stay stable if these labels ever change

resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - secretproviderclass.yaml
  - api.yaml
  - worker.yaml
  - networkpolicy.yaml

# Digests from build.yml push run 46086388811 (main commit 24db8af), pinned by hand for
# now. CI will maintain them later:
#   kustomize edit set image gyazo-api=acrgyazodevpx0x8.azurecr.io/gyazo-api@sha256:...
images:
  - name: gyazo-api
    newName: acrgyazodevpx0x8.azurecr.io/gyazo-api
    digest: sha256:4d8947bfc662011503c7067ffe5177bc5291031f156b3cdd4a9aa59feecd3610
  - name: gyazo-worker
    newName: acrgyazodevpx0x8.azurecr.io/gyazo-worker
    digest: sha256:73698bcce8377c4f6b2cc7a4095f4bfb07185af095401ac9cf7c12a684724c36
