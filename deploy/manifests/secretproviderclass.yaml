apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: owner-api-key
  namespace: gyazo
  labels:
    app.kubernetes.io/name: gyazo-api
    app.kubernetes.io/component: api
spec:
  provider: azure
  # No secretObjects: the value is mounted as a file only, never synced to a Kubernetes Secret.
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: 683be59e-d1eb-4c22-829e-0ecc75ed21e3 # api UAMI via workload identity (not a secret)
    keyvaultName: kv-gyazo-dev-px0x8
    tenantId: 79906a38-3bc4-4593-a1f4-acc599980625
    objects: |
      array:
        - |
          objectName: owner-api-key
          objectType: secret
