# Application routes (D-028). In the gyazo namespace, next to the api Service, so the
# backendRefs are same-namespace and need no ReferenceGrant. They attach to the https
# listener of Gateway edge/public, which admits routes from gyazo only (gateway.yaml).
#
# Two routes to the same Service so that /upload can carry its own BackendTrafficPolicy
# (policies.yaml): body-size limit and rate limit apply to uploads only, not to page
# loads, /i/<id> redirects or the JSON API.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: gyazo
  labels:
    app.kubernetes.io/name: gyazo-api
    app.kubernetes.io/component: api
spec:
  parentRefs:
    - name: public
      namespace: edge
      sectionName: https
  hostnames:
    - gyazo-dev-px0x8.centralus.cloudapp.azure.com
  rules:
    # No matches = PathPrefix "/": everything that isn't /upload.
    - backendRefs:
        - name: api
          port: 80
---
# Exact path /upload, every method. An Exact match takes precedence over the PathPrefix
# "/" route above. Matching all methods (not just POST) means a PUT or PATCH to /upload
# can't sidestep the size and rate limits through the catch-all route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-upload
  namespace: gyazo
  labels:
    app.kubernetes.io/name: gyazo-api
    app.kubernetes.io/component: api
spec:
  parentRefs:
    - name: public
      namespace: edge
      sectionName: https
  hostnames:
    - gyazo-dev-px0x8.centralus.cloudapp.azure.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /upload
      backendRefs:
        - name: api
          port: 80
