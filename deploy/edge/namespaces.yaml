# Namespaces for the edge (D-028). Apply this file first (README step 0), before the Helm
# installs, so Pod Security Admission applies to the very first pods.
#
# Enforce versions are pinned to v1.36, the cluster's minor, for the same reason as the
# gyazo namespace (D-027): a cluster minor upgrade can't silently tighten enforcement.
# Bump them with each minor upgrade. audit/warn track "latest".
#
# No NetworkPolicy in these three namespaces yet (known gap in docs/spec.md, D-028).

# Envoy Gateway controller + the Envoy proxy pods it creates (the proxies run here, not
# in the Gateway's namespace, in the default "controller namespace" mode).
# enforce: baseline, not restricted. The proxy pod spec is generated by the controller,
# not written by us. Its source (v1.10.0) sets restricted-compatible container contexts,
# but that is read from code, not seen on the cluster. warn/audit "restricted" report any
# violation at install; tighten enforce to restricted once they are clean (D-028).
apiVersion: v1
kind: Namespace
metadata:
  name: envoy-gateway-system
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
# cert-manager controller, webhook, cainjector. The chart's pods are restricted-compatible
# by default (values/cert-manager.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
# Edge configuration: the Gateway, its TLS Secret gyazo-tls (written by cert-manager), the
# redirect route, and the short-lived ACME HTTP-01 solver pod, Service and HTTPRoute that
# cert-manager creates next to the Certificate during issuance and renewal.
apiVersion: v1
kind: Namespace
metadata:
  name: edge
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
