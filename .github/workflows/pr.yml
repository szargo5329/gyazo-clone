name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # hashFiles() isn't allowed in job-level `if`, so detect which stacks exist here.
  detect:
    runs-on: ubuntu-latest
    outputs:
      tf: ${{ steps.d.outputs.tf }}
      py: ${{ steps.d.outputs.py }}
      web: ${{ steps.d.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          has() { [ -n "$(find . -path ./node_modules -prune -o "$@" -print -quit)" ] && echo true || echo false; }
          {
            echo "tf=$(has -path './infra/*' -name '*.tf')"
            echo "py=$(has -name pyproject.toml)"
            echo "web=$( [ -f app/web/package.json ] && echo true || echo false )"
          } >> "$GITHUB_OUTPUT"

  terraform-static:
    name: terraform fmt / validate / tflint
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.tf == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - uses: terraform-linters/setup-tflint@v4
      - run: terraform fmt -check -recursive infra
      - name: validate each root
        run: |
          for d in $(find infra -name '*.tf' -not -path '*/modules/*' -exec dirname {} \; | sort -u); do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done
      - run: tflint --init && tflint --recursive

  terraform-plan:
    name: terraform plan (dev)
    runs-on: ubuntu-latest
    needs: terraform-static
    # Enabled once M1 sets the OIDC repo variables (no secrets: client/tenant/subscription IDs are identifiers).
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    permissions:
      contents: read
      id-token: write       # GitHub OIDC token → Azure federated credential
      pull-requests: write  # post plan summary
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - run: terraform -chdir=infra/terraform/envs/dev init -input=false
      - run: terraform -chdir=infra/terraform/envs/dev plan -input=false -no-color -lock=false | tee plan.txt
      - name: plan summary
        run: |
          { echo '```'; tail -c 60000 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  python:
    name: python lint / test
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.py == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    name: web lint / test / build
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm --prefix app/web ci
      - run: npm --prefix app/web run lint
      - run: npm --prefix app/web run test --if-present
      - run: npm --prefix app/web run build

  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  iac-scan:
    name: checkov (IaC security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,kubernetes,helm,github_actions
          quiet: true          # only show failed checks
          # Suppress a check only inline (#checkov:skip=CKV_X:reason) with a reason, never here.

  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
