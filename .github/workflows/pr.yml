name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (public repo: tags can be moved). Dependabot bumps them.

jobs:
  # hashFiles() isn't allowed in job-level `if`, so detect which stacks exist here.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tf: ${{ steps.d.outputs.tf }}
      py: ${{ steps.d.outputs.py }}
      web: ${{ steps.d.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: d
        run: |
          has() { [ -n "$(find . -path ./node_modules -prune -o "$@" -print -quit)" ] && echo true || echo false; }
          {
            echo "tf=$(has -path './infra/*' -name '*.tf')"
            echo "py=$(has -name pyproject.toml)"
            echo "web=$( [ -f app/web/package.json ] && echo true || echo false )"
          } >> "$GITHUB_OUTPUT"

  terraform-static:
    name: terraform fmt / validate / tflint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect
    if: needs.detect.outputs.tf == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0
      - run: terraform fmt -check -recursive infra
      - name: validate each root
        run: |
          for d in $(find infra -name '*.tf' -not -path '*/modules/*' -exec dirname {} \; | sort -u); do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done
      - run: tflint --init && tflint --recursive

  terraform-plan:
    name: terraform plan (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: terraform-static
    # Enabled once M1 sets the OIDC repo variables (no secrets: client/tenant/subscription IDs are identifiers).
    # The identity behind this job is READ-ONLY (see decisions D-012); apply uses a separate identity.
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    # TODO(M1): add `environment: plan` here so the OIDC subject matches D-012's federated credential.
    permissions:
      contents: read
      id-token: write # GitHub OIDC token → Azure federated credential
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        shell: bash # explicit bash = -eo pipefail, so a failing plan can't hide behind a pipe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - run: terraform -chdir=infra/terraform/envs/dev init -input=false
      - run: terraform -chdir=infra/terraform/envs/dev plan -input=false -no-color -lock=false -out=tfplan
      - name: plan summary (resource list only; repo is public)
        run: |
          terraform -chdir=infra/terraform/envs/dev show -no-color tfplan > plan.txt
          { echo '```'; grep -E '^\s+# |^Plan:|^No changes' plan.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  python:
    name: python lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect
    if: needs.detect.outputs.py == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --all-packages --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    name: web lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect
    if: needs.detect.outputs.web == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm --prefix app/web ci
      - run: npm --prefix app/web run lint
      - run: npm --prefix app/web run test --if-present
      - run: npm --prefix app/web run build

  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # 1.7.7
        with:
          args: -color

  iac-scan:
    name: checkov (IaC security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bridgecrewio/checkov-action@3f0caf0c3aa9f56ade6b49f6e60b63aaeafb75a3 # v12.3141.0
        with:
          directory: .
          framework: terraform,kubernetes,helm,github_actions
          quiet: true # only show failed checks
          # Suppress a check only inline (#checkov:skip=CKV_X:reason) with a reason, never here.

  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # gitleaks reads the PR's commits via the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
