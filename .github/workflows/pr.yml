name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (public repo: tags can be moved). Dependabot bumps them.

jobs:
  # hashFiles() isn't allowed in job-level `if`, so detect which stacks exist here.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tf: ${{ steps.d.outputs.tf }}
      py: ${{ steps.d.outputs.py }}
      web: ${{ steps.d.outputs.web }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: d
        run: |
          has() { [ -n "$(find . -path ./node_modules -prune -o "$@" -print -quit)" ] && echo true || echo false; }
          {
            echo "tf=$(has -path './infra/*' -name '*.tf')"
            echo "py=$(has -name pyproject.toml)"
            echo "web=$( [ -f app/web/package.json ] && echo true || echo false )"
          } >> "$GITHUB_OUTPUT"

  terraform-static:
    name: terraform fmt / validate / tflint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect
    if: needs.detect.outputs.tf == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.65.0
      - run: terraform fmt -check -recursive infra
      - name: validate each root
        run: |
          for d in $(find infra -name '*.tf' -not -path '*/modules/*' -exec dirname {} \; | sort -u); do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done
      - run: tflint --init && tflint --recursive
        env:
          GITHUB_TOKEN: ${{ github.token }} # authenticated plugin download (anonymous API is rate-limited on shared runners)

  terraform-plan:
    name: terraform plan (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: terraform-static
    # Enabled once bootstrap is applied and the variables are set (identifiers, not secrets).
    # Repo vars: AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, TFSTATE_RG, TFSTATE_ACCOUNT.
    # `plan` environment var AZURE_CLIENT_ID = id-gyazo-ci-plan (READ-ONLY, D-012).
    if: ${{ vars.AZURE_TENANT_ID != '' }}
    # OIDC subject repo:<owner>@<owner_id>/<repo>@<repo_id>:environment:plan must match the federated credential (D-012)
    environment: plan
    permissions:
      contents: read
      id-token: write # GitHub OIDC token → Azure federated credential
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        shell: bash # explicit bash = -eo pipefail, so a failing plan can't hide behind a pipe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - run: >-
          terraform -chdir=infra/terraform/envs/dev init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_ACCOUNT }}"
          -backend-config="container_name=tfstate" -backend-config="key=dev.tfstate"
          -backend-config="use_azuread_auth=true"
      - run: terraform -chdir=infra/terraform/envs/dev plan -input=false -no-color -lock=false -out=tfplan > /dev/null
      # Destroy/replace guard: warn only. A PR may legitimately propose a destroy; the reviewer decides.
      # apply.yml fails on the same condition unless it is a deliberate manual run.
      - name: plan summary (resource list only; repo is public)
        run: |
          terraform -chdir=infra/terraform/envs/dev show -no-color tfplan > plan.txt
          terraform -chdir=infra/terraform/envs/dev show -json tfplan > plan.json
          # "delete" in actions covers delete and replace (["delete","create"] / ["create","delete"]).
          jq -r '.resource_changes[]? | select(any(.change.actions[]; . == "delete")) | .address' plan.json > destroys.txt
          count=$(grep -c . destroys.txt || true)
          if [ "$count" -gt 0 ]; then
            echo "::warning::Plan destroys or replaces $count resource(s); see the run summary."
            {
              echo "> [!WARNING]"
              echo "> **This plan destroys or replaces $count resource(s).** The apply workflow will refuse it unless run manually with \`allow_destroy\`."
              echo
              # shellcheck disable=SC2016  # literal backticks for markdown, no expansion intended
              sed 's/^/- `/; s/$/`/' destroys.txt
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          { echo '```'; grep -E '^\s+# |^Plan:|^No changes' plan.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  python:
    name: python lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect
    if: needs.detect.outputs.py == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --all-packages --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    name: web lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect
    if: needs.detect.outputs.web == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm --prefix app/web ci
      - run: npm --prefix app/web run lint
      - run: npm --prefix app/web run test --if-present
      - run: npm --prefix app/web run build

  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # 1.7.7
        with:
          args: -color

  iac-scan:
    name: checkov (IaC security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: bridgecrewio/checkov-action@3f0caf0c3aa9f56ade6b49f6e60b63aaeafb75a3 # v12.3141.0
        with:
          directory: .
          framework: terraform,kubernetes,helm,github_actions
          quiet: true # only show failed checks
          # Suppress a check only inline (#checkov:skip=CKV_X:reason) with a reason, never here.

  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # gitleaks reads the PR's commits via the API
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
