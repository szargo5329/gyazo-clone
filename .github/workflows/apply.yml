name: apply

# Applies infra/terraform/envs/dev after a merge to main, in two jobs:
#   1. plan  — read-only identity; writes the resource list to the run summary and uploads the plan file.
#   2. apply — waits for the owner's approval in the `apply` environment, then applies EXACTLY that plan file.
# So the approver reads the real plan (in the run summary) before clicking Approve.
# Destroy/replace guard: the plan job FAILS if the plan deletes or replaces anything, so an accidental
# destroy never reaches the Approve button. Intentional teardown = manual run with allow_destroy: true.
on:
  push:
    branches: [main]
    paths: ["infra/terraform/**"]
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7:allow_destroy is a safety gate, not a build parameter; it never reaches Terraform and only unblocks a deliberate teardown
    inputs:
      allow_destroy:
        description: "Allow a plan that deletes or replaces resources (still needs approval in the apply environment)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apply-dev
  cancel-in-progress: false # never cancel a running apply

env:
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_DIR: infra/terraform/envs/dev

jobs:
  plan:
    name: terraform plan (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Enforced here, not only by the environment's branch rule: workflow_dispatch could target any ref.
    if: ${{ vars.AZURE_TENANT_ID != '' && github.ref == 'refs/heads/main' }}
    environment: plan
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }} # `plan` environment var = id-gyazo-ci-plan
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: init
        run: >-
          terraform -chdir="$TF_DIR" init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_ACCOUNT }}"
          -backend-config="container_name=tfstate" -backend-config="key=dev.tfstate"
          -backend-config="use_azuread_auth=true"
      - name: plan (full output kept out of the public log)
        run: terraform -chdir="$TF_DIR" plan -input=false -no-color -lock=false -out=tfplan > /dev/null
      - name: plan summary for the approver + destroy/replace guard
        env:
          ALLOW_DESTROY: ${{ inputs.allow_destroy }} # via env, never inline in run: (script injection)
        run: |
          terraform -chdir="$TF_DIR" show -no-color tfplan > plan.txt
          terraform -chdir="$TF_DIR" show -json tfplan > plan.json
          # "delete" in actions covers delete and replace (["delete","create"] / ["create","delete"]).
          jq -r '.resource_changes[]? | select(any(.change.actions[]; . == "delete")) | .address' plan.json > destroys.txt
          count=$(grep -c . destroys.txt || true)
          allowed=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$ALLOW_DESTROY" = "true" ]; then allowed=true; fi
          if [ "$count" -gt 0 ]; then
            {
              echo "> [!CAUTION]"
              if [ "$allowed" = true ]; then
                echo "> **This plan destroys or replaces $count resource(s).** Allowed by a manual run with \`allow_destroy: true\`."
              else
                echo "> **This plan destroys or replaces $count resource(s). Blocked:** the apply job will not run. To proceed on purpose, run this workflow manually with \`allow_destroy: true\`."
              fi
              echo
              sed 's/^/- `/; s/$/`/' destroys.txt
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          { echo '### Review this before approving the apply job'; echo '```'; grep -E '^\s+# |^Plan:|^No changes' plan.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ] && [ "$allowed" != true ]; then
            echo "::error::Plan destroys or replaces $count resource(s); refusing without workflow_dispatch allow_destroy=true. See the run summary."
            exit 1
          fi
      # Public repo: logged-in users can download artifacts. The plan file holds full planned values,
      # so sensitive values must NEVER enter this config (they don't today: no secrets in Terraform).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 1

  apply:
    name: terraform apply (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plan
    if: ${{ github.ref == 'refs/heads/main' }}
    # Required reviewer + main only. OIDC subject (D-012): repo:<owner>@<owner_id>/<repo>@<repo_id>:environment:apply
    environment: apply
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }} # `apply` environment var = id-gyazo-ci-apply
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}
      - name: init
        run: >-
          terraform -chdir="$TF_DIR" init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_ACCOUNT }}"
          -backend-config="container_name=tfstate" -backend-config="key=dev.tfstate"
          -backend-config="use_azuread_auth=true"
      # Applying a saved plan fails if state changed since the plan was made: no surprise changes.
      - run: terraform -chdir="$TF_DIR" apply -input=false -no-color tfplan
